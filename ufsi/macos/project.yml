# XcodeGen specification for the macOS app and FSKit extension.
name: UFSI
options:
  bundleIdPrefix: com.specta
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CLANG_ENABLE_MODULES: YES
targets:
  UFSIApp:
    type: application
    platform: macOS
    sources:
      - UFSIApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.specta.ufsi
        PRODUCT_NAME: UFSI
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        PROVISIONING_PROFILE_SPECIFIER: "$(UFSI_APP_PROFILE)"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        CODE_SIGN_ENTITLEMENTS: UFSIApp/UFSIApp.entitlements
    dependencies:
      - target: UFSIExtension
        embed: true
    scheme:
      testTargets:
        - UFSIExtensionTests

  UFSIExtension:
    type: extensionkit-extension
    platform: macOS
    sources:
      - UFSIExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.specta.ufsi.extension
        PRODUCT_NAME: UFSIExtension
        PROVISIONING_PROFILE_SPECIFIER: "$(UFSI_EXTENSION_PROFILE)"
        INFOPLIST_FILE: UFSIExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: UFSIExtension/UFSIExtension.entitlements
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES

  UFSIExtensionTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - UFSIExtensionTests
      - path: UFSIExtension/RustBackend.swift
        buildPhase: sources
      - path: UFSIExtension/UFSIItem.swift
        buildPhase: sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.specta.ufsi.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: ""
        BUNDLE_LOADER: ""
