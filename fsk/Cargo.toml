[package]
name = "fsk"
version = "0.0.9"
description = "Build cross-platform virtual file systems with ease"
authors = ["Oscar Beaumont <oscar@otbeaumont.me>"]
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository = "https://github.com/specta-rs/fsk"
documentation = "https://docs.rs/fsk/latest/fsk"
readme = "../README.md"
keywords = ["filesystem", "virtual-filesystem", "fuse", "fskit", "projfs"]
categories = ["api-bindings", "filesystem"]
include = ["/src", "/macos/rust", "/benches", "/Cargo.toml"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
default-target = "x86_64-unknown-linux-gnu"
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc", "aarch64-apple-darwin"]

[dependencies]
parking_lot = "0.12"

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
fuser = { version = "0.17", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_ProjectedFileSystem",
    "Win32_System_Com",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
] }

[dev-dependencies]
tempfile = "3"

[[bench]]
name = "throughput"
harness = false
test = false

[[bench]]
name = "raw_overhead"
harness = false
test = false

[lints]
workspace = true
