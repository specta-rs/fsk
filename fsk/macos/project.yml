# XcodeGen specification for the macOS app and FSKit extension.
name: FSK
options:
  bundleIdPrefix: dev.specta
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CLANG_ENABLE_MODULES: YES
targets:
  FSKApp:
    type: application
    platform: macOS
    sources:
      - FSKApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.specta.fsk
        PRODUCT_NAME: FSK
        MARKETING_VERSION: "0.0.9"
        CURRENT_PROJECT_VERSION: "9"
        PROVISIONING_PROFILE_SPECIFIER: "$(FSK_APP_PROFILE)"
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        CODE_SIGN_ENTITLEMENTS: FSKApp/FSKApp.entitlements
    dependencies:
      - target: FSKExtension
        embed: true
    scheme:
      testTargets:
        - FSKExtensionTests

  FSKExtension:
    type: extensionkit-extension
    platform: macOS
    sources:
      - FSKExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.specta.fsk.extension
        PRODUCT_NAME: FSKExtension
        PROVISIONING_PROFILE_SPECIFIER: "$(FSK_EXTENSION_PROFILE)"
        ENABLE_HARDENED_RUNTIME: YES
        INFOPLIST_FILE: FSKExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: FSKExtension/FSKExtension.entitlements
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES

  FSKExtensionTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - FSKExtensionTests
      - path: FSKExtension/RustBackend.swift
        buildPhase: sources
      - path: FSKExtension/FSKItem.swift
        buildPhase: sources
      - path: FSKExtension/FSKVolume.swift
        buildPhase: sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.specta.fsk.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: ""
        BUNDLE_LOADER: ""
