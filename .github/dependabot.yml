version: 2

# One PR for every dependency bump.
# 
# All ecosystems share a single multi-ecosystem group, so upgrades are
# reviewed together instead of one PR per ecosystem.

multi-ecosystem-groups:
  fsk-deps:
    schedule:
      interval: "weekly"

updates:
  - package-ecosystem: "cargo"
    directory: "/"
    multi-ecosystem-group: "fsk-deps"
    patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    multi-ecosystem-group: "fsk-deps"
    patterns: ["*"]

