name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.4.1.app

      - name: Install build tools
        run: |
          brew install xcodegen
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Generate Xcode project
        working-directory: ufsi/macos
        run: xcodegen generate

      - name: Install signing certificate and provisioning profiles
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APP_PROVISIONING_PROFILE_BASE64: ${{ secrets.APP_PROVISIONING_PROFILE_BASE64 }}
          EXTENSION_PROVISIONING_PROFILE_BASE64: ${{ secrets.EXTENSION_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          certificate_path="$RUNNER_TEMP/developer-id.p12"
          app_profile_path="$RUNNER_TEMP/app.provisionprofile"
          extension_profile_path="$RUNNER_TEMP/extension.provisionprofile"
          keychain_path="$RUNNER_TEMP/ufsi-signing.keychain-db"

          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"
          printf '%s' "$APP_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$app_profile_path"
          printf '%s' "$EXTENSION_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$extension_profile_path"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$keychain_path"
          security list-keychain -d user -s "$keychain_path"

          install_profile() {
            profile_path="$1"
            profile_plist="$2"
            security cms -D -i "$profile_path" > "$profile_plist"
            profile_uuid=$(/usr/libexec/PlistBuddy -c "Print UUID" "$profile_plist")
            mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
            cp "$profile_path" "$HOME/Library/MobileDevice/Provisioning Profiles/$profile_uuid.provisionprofile"
            printf '%s' "$profile_uuid"
          }

          app_profile_uuid=$(install_profile "$app_profile_path" "$RUNNER_TEMP/app-profile.plist")
          extension_profile_uuid=$(install_profile "$extension_profile_path" "$RUNNER_TEMP/extension-profile.plist")
          echo "APP_PROFILE_UUID=$app_profile_uuid" >> "$GITHUB_ENV"
          echo "EXTENSION_PROFILE_UUID=$extension_profile_uuid" >> "$GITHUB_ENV"

      - name: Archive universal application
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          xcodebuild \
            -project ufsi/macos/UFSI.xcodeproj \
            -scheme UFSIApp \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/UFSI.xcarchive" \
            ARCHS="arm64 x86_64" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            UFSI_APP_PROFILE="$APP_PROFILE_UUID" \
            UFSI_EXTENSION_PROFILE="$EXTENSION_PROFILE_UUID" \
            archive

      - name: Export signed application
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>developer-id</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Developer ID Application</string>
            <key>teamID</key>
            <string>$APPLE_TEAM_ID</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>dev.specta.fsk</key>
              <string>$APP_PROFILE_UUID</string>
              <key>dev.specta.fsk.extension</key>
              <string>$EXTENSION_PROFILE_UUID</string>
            </dict>
          </dict>
          </plist>
          EOF

          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/UFSI.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Notarize and staple
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          ditto -c -k --keepParent "$RUNNER_TEMP/export/UFSI.app" "$RUNNER_TEMP/notarization.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarization.zip" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$RUNNER_TEMP/export/UFSI.app"
          ditto -c -k --keepParent "$RUNNER_TEMP/export/UFSI.app" \
            "$RUNNER_TEMP/UFSI-${GITHUB_REF_NAME}.zip"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "$RUNNER_TEMP/UFSI-${GITHUB_REF_NAME}.zip" \
            --title "UFSI $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag

  publish-crate:
    name: Publish ufsi to crates.io
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Verify tag matches crate version
        shell: bash
        run: |
          set -euo pipefail
          crate_version=$(cargo metadata --no-deps --format-version 1 |
            jq -r '.packages[] | select(.name == "ufsi") | .version')
          test "$GITHUB_REF_NAME" = "v$crate_version"

      - name: Authenticate with crates.io
        id: crates_io_auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish crate
        run: cargo publish -p ufsi --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_io_auth.outputs.token }}
