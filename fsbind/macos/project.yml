# XcodeGen specification for the macOS app and FSKit extension.
name: FSBind
options:
  bundleIdPrefix: com.specta
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CLANG_ENABLE_MODULES: YES
targets:
  FSBindApp:
    type: application
    platform: macOS
    sources:
      - FSBindApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.specta.fsbind
        PRODUCT_NAME: FSBind
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        PROVISIONING_PROFILE_SPECIFIER: "$(FSBIND_APP_PROFILE)"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        CODE_SIGN_ENTITLEMENTS: FSBindApp/FSBindApp.entitlements
    dependencies:
      - target: FSBindExtension
        embed: true
    scheme:
      testTargets:
        - FSBindExtensionTests

  FSBindExtension:
    type: extensionkit-extension
    platform: macOS
    sources:
      - FSBindExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.specta.fsbind.extension
        PRODUCT_NAME: FSBindExtension
        PROVISIONING_PROFILE_SPECIFIER: "$(FSBIND_EXTENSION_PROFILE)"
        INFOPLIST_FILE: FSBindExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: FSBindExtension/FSBindExtension.entitlements
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES

  FSBindExtensionTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - FSBindExtensionTests
      - path: FSBindExtension/RustBackend.swift
        buildPhase: sources
      - path: FSBindExtension/FSBindItem.swift
        buildPhase: sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.specta.fsbind.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: ""
        BUNDLE_LOADER: ""
